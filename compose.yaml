services:
  report-agent:
    build:
      context: .
    env_file:
      - config/app.env
      - .env
    environment:
      PYTHONPATH: /app
      REPORT_AGENT_STATIC_DIR: /app/frontend/dist
      REPORT_AGENT_RUNTIME_ROOT: /app/runtime
      REPORT_AGENT_CHECKPOINT_DB_PATH: /app/runtime/agent_memory_fastapi.db
      REPORT_AGENT_CORS_ALLOW_ORIGIN_REGEX: '^http://(127\.0\.0\.1|localhost):\d+$'
    ports:
      - "8000:8000"
    volumes:
      - ./runtime:/app/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
